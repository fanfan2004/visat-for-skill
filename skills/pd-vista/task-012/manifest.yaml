schema_version: 1
source_content_equivalence: byte-for-byte-under-modules
modules:
  - id: fuzzy-match
    path: modules/fuzzy-match/SKILL.md
    triggers: [fraud_field_mismatch]
  - id: pdf
    path: modules/pdf/SKILL.md
    triggers: [fraud_missed, missing_output_file]
  - id: xlsx
    path: modules/xlsx/SKILL.md
    triggers: [fraud_false_positive]
