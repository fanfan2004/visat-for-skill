<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock Sector Bubble Chart</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <h1>Stock Sector Visualization</h1>
      <p>
        50 instruments clustered by sector. Bubble area scales with market
        capitalization (ETFs use a uniform size). Click a bubble or a row to
        cross-highlight.
      </p>
    </header>

    <main>
      <section id="chart-section">
        <h2 class="section-title">Bubble Chart</h2>
        <svg id="bubble-chart" role="img" aria-label="Stock bubbles clustered by sector"></svg>
        <div id="sector-legend" class="legend"></div>
      </section>

      <section id="table-section">
        <h2 class="section-title">Stock Table</h2>
        <div class="table-wrap">
          <table id="stocks-table">
            <thead>
              <tr>
                <th>Ticker symbol</th>
                <th>Full company name</th>
                <th>Sector</th>
                <th style="text-align: right">Market cap</th>
              </tr>
            </thead>
            <tbody id="stocks-table-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="js/d3.v6.min.js"></script>
    <script src="js/visualization.js"></script>
  </body>
</html>
