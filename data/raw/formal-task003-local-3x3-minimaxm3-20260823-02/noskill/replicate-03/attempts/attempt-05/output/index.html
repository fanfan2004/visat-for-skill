<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Sector Visualization</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <h1 id="title">Stock Sector Visualization</h1>
    <div id="main">
      <div id="chart-panel">
        <div id="bubble-chart"></div>
        <div id="legend"></div>
        <div id="tooltip" role="tooltip" class="tooltip"></div>
      </div>
      <div id="table-panel">
        <h2>Stocks</h2>
        <div class="table-scroll">
          <table id="stocks-table">
            <thead>
              <tr>
                <th>Ticker symbol</th>
                <th>Full company name</th>
                <th>Sector</th>
                <th>Market cap</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
