<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Stock Sector Bubble Chart</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <h1>Stock Sector Bubble Chart</h1>
    <p class="subtitle">Stocks sized by market capitalization, clustered by sector. Click a bubble or table row to highlight.</p>

    <div class="app">
        <section class="chart-panel">
            <h2>Bubble Chart</h2>
            <svg id="bubble-chart" width="820" height="620" xmlns="http://www.w3.org/2000/svg"></svg>
            <div id="legend" class="legend"></div>
        </section>

        <section class="table-panel">
            <h2>Stock Details</h2>
            <div class="table-wrapper">
                <table id="stock-table" class="stock-table">
                    <thead>
                        <tr>
                            <th>Ticker symbol</th>
                            <th>Full company name</th>
                            <th>Sector</th>
                            <th style="text-align:right">Market cap</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="tooltip"></div>

    <script src="js/d3.v6.min.js"></script>
    <script src="js/visualization.js"></script>
</body>
</html>
