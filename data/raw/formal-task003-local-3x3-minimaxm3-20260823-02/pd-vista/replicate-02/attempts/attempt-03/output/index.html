<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stock Market Capitalization Visualization</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Stock Market Capitalization Visualization</h1>
      <p>S&amp;P 500 sample &mdash; 40 stocks + 10 ETFs, sized by market cap and clustered by sector.</p>
    </header>
    <div id="main">
      <section id="chart-panel">
        <h2>Sector Cluster Bubble Chart</h2>
        <svg id="bubble-chart" viewBox="0 0 900 640" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="legend"></div>
      </section>
      <section id="table-panel">
        <h2>Stock List</h2>
        <div id="table-scroll">
          <table id="stock-table">
            <thead>
              <tr>
                <th>Ticker symbol</th>
                <th>Full company name</th>
                <th>Sector</th>
                <th>Market cap</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
  <div id="tooltip"></div>
  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
