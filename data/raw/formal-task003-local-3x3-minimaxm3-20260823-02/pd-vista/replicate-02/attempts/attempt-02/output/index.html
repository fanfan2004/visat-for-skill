<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Sector Bubble Visualization</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <h1>Stock Sector Bubble Visualization</h1>
    <p>Bubble chart clustered by sector (sized by market cap) with a synchronized stock table.</p>
  </header>

  <main class="layout">
    <section class="chart-panel" aria-label="Stock bubble chart">
      <h2 class="panel-title">Sector Bubble Chart</h2>
      <div id="chart"></div>
    </section>

    <section class="table-panel" aria-label="Stock data table">
      <h2 class="panel-title">Stock Details</h2>
      <table id="data-table">
        <thead>
          <tr>
            <th>Ticker symbol</th>
            <th>Full company name</th>
            <th>Sector</th>
            <th>Market cap</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
