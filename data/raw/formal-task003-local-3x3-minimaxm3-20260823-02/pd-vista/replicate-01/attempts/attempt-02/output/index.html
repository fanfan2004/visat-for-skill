<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Sector Bubble Chart</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="header">
      <h1>Stock Sector Bubble Chart</h1>
      <span class="subtitle">Bubble size = market cap &middot; Color = sector &middot; Click a bubble or table row to highlight</span>
    </div>
    <div id="main">
      <div id="chart-panel">
        <h2>Bubble Chart</h2>
        <div id="bubble-chart"></div>
        <div id="legend"></div>
      </div>
      <div id="table-panel">
        <h2>Stocks Table</h2>
        <div id="table-wrap">
          <table id="stocks-table">
            <thead>
              <tr>
                <th>Ticker symbol</th>
                <th>Full company name</th>
                <th>Sector</th>
                <th>Market cap</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  <script src="js/d3.v6.min.js"></script>
  <script src="js/visualization.js"></script>
</body>
</html>
